# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
#
# Generated by the Azure portal for app-raphael-dev-eus2 and repointed by hand on 2026-09-17,
# because RE-014 rebuilt the DEV environment in South Central US and the region of an Azure
# resource is not something you change -- you recreate it. What that broke, and what was done:
#
#   · app-name now names the site that exists. The old one was deleted with its resource group.
#   · The three AZUREAPPSERVICE_* secrets pointed at the identity of the deleted environment.
#     They were replaced by AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID, which
#     hold the user-assigned identity `id-raphael-dev-github-scus` that the provisioning script
#     creates, with its federated credential for this repository and this branch. Nothing here
#     is a password: OIDC means GitHub proves who it is and Azure hands back a short-lived
#     token, so no credential is ever stored.
#   · publish targets Raphael.Api explicitly. Publishing the solution put the output of three
#     projects into one folder and happened to work; naming the entry point says what is meant.
#
# ⚠️ This deploys to DEV on every push to main. It is not the production host: production is
# still MyASP.NET, untouched, and stays that way until the cutover phase.

name: Build and deploy ASP.Net Core app to Azure Web App - app-raphael-dev-scus

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Build with dotnet
        run: dotnet build Raphael.Backend.sln --configuration Release

      - name: dotnet publish
        run: dotnet publish Raphael.Api/Raphael.Api.csproj -c Release --no-build -o ${{env.DOTNET_ROOT}}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'app-raphael-dev-scus'
          slot-name: 'Production'
          package: .
